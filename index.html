<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PTSA Tool &amp; Machine Manager</title>
<meta name="theme-color" content="#072b4f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#072b4f; --blue:#1d5e95; --cyan:#39c5e9;
  --bg:#f1f4f8; --surface:#ffffff; --ink:#10253b; --muted:#5f6b78; --line:#d8dfe7;
  --brand:#072b4f; --on-brand:#ffffff; --hero:#1d5e95; --gray:#e3e3e3; --primary:#1d5e95; --on-primary:#ffffff;
  --brass:#1d5e95; --brass-soft:#e3f3fa;
  --ok:#166534; --ok-bg:#dcfce7; --info:#1d5e95; --info-bg:#dcebf7; --bad:#991b1b; --bad-bg:#fee2e2; --warn:#92400e; --warn-bg:#fef3c7;
  --mute-bg:#e8ecf0; --mute:#566170; --mach:#072b4f; --mach-bg:#c9eefa; --tool:#1d5e95; --tool-bg:#dcebf7;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --navy:#041425; --bg:#06192d; --surface:#0b2540; --ink:#eaf1f8; --muted:#9fb2c6; --line:#1d3d5f;
    --brand:#041425; --on-brand:#ffffff; --hero:#0e3555; --gray:#14304d; --primary:#2c7cba; --on-primary:#ffffff; --brass:#39c5e9; --brass-soft:#0e3555;
    --ok:#86efac; --ok-bg:#12301d; --info:#8cc8f2; --info-bg:#0f2f50; --bad:#fca5a5; --bad-bg:#3a1616; --warn:#fcd34d; --warn-bg:#33270c;
    --mute-bg:#14304d; --mute:#a9bccf; --mach:#7fe0f5; --mach-bg:#0f3b4d; --tool:#8cc8f2; --tool-bg:#12365a;
  }
}
:root[data-theme="dark"]{
  --navy:#041425; --bg:#06192d; --surface:#0b2540; --ink:#eaf1f8; --muted:#9fb2c6; --line:#1d3d5f;
  --brand:#041425; --on-brand:#ffffff; --hero:#0e3555; --gray:#14304d; --primary:#2c7cba; --on-primary:#ffffff; --brass:#39c5e9; --brass-soft:#0e3555;
  --ok:#86efac; --ok-bg:#12301d; --info:#8cc8f2; --info-bg:#0f2f50; --bad:#fca5a5; --bad-bg:#3a1616; --warn:#fcd34d; --warn-bg:#33270c;
  --mute-bg:#14304d; --mute:#a9bccf; --mach:#7fe0f5; --mach-bg:#0f3b4d; --tool:#8cc8f2; --tool-bg:#12365a;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Roboto",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
h1,h2,h3{font-family:"Roboto",system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:700;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brass);outline-offset:2px;border-radius:6px}
.container{max-width:1240px;margin:0 auto;padding:0 1.25rem 3rem}
.hidden{display:none!important}
.muted{color:var(--muted)}
.small{font-size:.82rem}

.topbar{background:#072b4f;color:#ccd9e4;font-size:.86rem}
.topbar .container{display:flex;justify-content:flex-end;align-items:center;gap:.5rem;padding-top:.8rem;padding-bottom:.8rem}
.topbar a{color:inherit;text-decoration:none;font-weight:500;display:inline-flex;align-items:center;gap:.5rem;letter-spacing:.01em}
.topbar svg{width:15px;height:15px;fill:currentColor}
nav{background:#fff;color:#1d5e95;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;box-shadow:0 2px 10px rgba(7,43,79,.18)}
nav .container{display:flex;align-items:center;justify-content:space-between;gap:.75rem;padding-bottom:.35rem;padding-top:.35rem;flex-wrap:wrap}
.brand{display:flex;align-items:center}
.brand img,.sitebar img{display:block;height:50px;width:auto}
.nav-links{display:flex;gap:.1rem;align-items:center;flex-wrap:wrap}
.nav-links button,.nav-links select{background:none;border:0;color:#1d5e95;padding:.5rem .7rem;border-radius:0;cursor:pointer;font-weight:500;font-size:.85rem;text-transform:uppercase;letter-spacing:.02em}
.nav-links select{background:#fff;border:1px solid #c5d3e0;border-radius:4px;max-width:200px;text-transform:none;margin-right:.4rem}
.nav-links select option{color:#10253b}
.nav-links button:hover{color:#39c5e9}
.nav-links button.current{color:#39c5e9;font-weight:500}
.nav-links button[data-a="logout"]{border:2px solid #39c5e9;border-radius:999px;padding:.55rem 1.1rem;margin-left:.4rem}
.nav-links button[data-a="logout"]:hover{background:#39c5e9;color:#fff}
.nav-user{font-size:.72rem;color:#5f6b78;margin:0 .1rem 0 .5rem;text-align:right;line-height:1.2;max-width:190px}
nav + .container{padding-top:0}
.sitebar{background:#fff;box-shadow:0 2px 10px rgba(7,43,79,.18)}
.sitebar .container{padding-top:.35rem;padding-bottom:.35rem}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;border:1px solid transparent;border-radius:4px;padding:.55rem .95rem;font-weight:600;cursor:pointer;transition:background .15s,transform .05s}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--primary);color:var(--on-primary)}
.btn-primary:hover:not(:disabled){opacity:.88}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{background:var(--brass-soft)}
.btn-danger{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn-danger:hover{background:var(--bad-bg)}
.btn-sm{padding:.3rem .65rem;font-size:.82rem;border-radius:4px}
.btn:disabled{opacity:.45;cursor:not-allowed}

.field{margin-bottom:.9rem}
.field label{display:block;font-size:.84rem;font-weight:600;margin-bottom:.3rem}
.input,.select,textarea.input{width:100%;padding:.55rem .7rem;border:1px solid var(--line);border-radius:4px;background:var(--surface)}
.input:focus,.select:focus{border-color:var(--brass)}
.hint{font-size:.8rem;color:var(--muted);margin-top:.25rem}
.check{display:flex;gap:.55rem;align-items:flex-start;font-size:.92rem;margin:.4rem 0;cursor:pointer}
.check input{margin-top:.25rem;accent-color:var(--brass)}

.login-wrap{min-height:100vh;background:var(--bg)}
.login-hero{background:var(--hero);color:#fff;padding:2.6rem 0 5.2rem}
.login-hero .container{padding-bottom:0}
.login-hero h1{font-size:2.3rem;line-height:1.1;margin-bottom:.4rem}
.login-hero p{font-size:1.05rem;color:rgba(255,255,255,.9);max-width:620px}
.login-card{width:calc(100% - 2.5rem);max-width:440px;margin:-3.2rem auto 2rem;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:1.75rem;box-shadow:0 8px 28px rgba(7,43,79,.16);position:relative}
.switch{text-align:center;margin-top:1rem;font-size:.9rem;color:var(--muted)}
.link{background:none;border:0;color:var(--brass);font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.demo{margin-top:1.25rem;background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:.8rem;font-size:.8rem;color:var(--muted)}
.demo .actions{margin-top:.5rem}
.alert{padding:.7rem .9rem;border-radius:10px;margin-bottom:1rem;font-size:.9rem;background:var(--bad-bg);color:var(--bad)}
.banner{padding:.8rem 1rem;border-radius:4px;margin-bottom:1.1rem;font-size:.92rem;background:var(--hero);color:#fff}

.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-bottom:1.5rem;padding:2.2rem 0 2rem;background:var(--hero);color:#fff;box-shadow:0 0 0 100vmax var(--hero);clip-path:inset(0 -100vmax)}
.page-head .btn{background:transparent;color:#fff;border:2px solid #fff;font-weight:700}
.page-head .btn:hover:not(:disabled){background:rgba(255,255,255,.16);opacity:1}
.page-head h2{font-size:2.3rem;line-height:1.1;color:#fff}
.page-head p{color:rgba(255,255,255,.88);font-size:1.05rem;max-width:760px}
.toolbar{display:flex;gap:.7rem;flex-wrap:wrap;margin-bottom:1rem;align-items:center}
.toolbar .input{flex:1 1 220px;max-width:380px}
.toolbar .select{width:auto;min-width:160px}
.chips{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1rem}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:.3rem .8rem;font-size:.84rem;font-weight:500;cursor:pointer}
.chip:hover{background:var(--brass-soft)}
.chip[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:1rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:1.05rem;display:flex;flex-direction:column;gap:.55rem}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:.5rem}
.card-name{font-family:"Roboto",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:1.15rem;font-weight:700;line-height:1.2}
.card-sub{font-size:.8rem;color:var(--muted)}
.card-desc{font-size:.88rem;color:var(--muted);flex:1}
.stock{display:flex;justify-content:space-between;font-size:.84rem;font-weight:600;margin-bottom:.3rem}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--brass);border-radius:4px}
.bar.low > i{background:#c2410c}
.badge{display:inline-block;padding:.18rem .6rem;border-radius:999px;font-size:.75rem;font-weight:700;white-space:nowrap}
.b-active{background:var(--info-bg);color:var(--info)}
.b-returned{background:var(--ok-bg);color:var(--ok)}
.b-overdue,.b-out{background:var(--bad-bg);color:var(--bad)}
.b-soon,.b-low{background:var(--warn-bg);color:var(--warn)}
.b-muted{background:var(--mute-bg);color:var(--mute)}
.tag{display:inline-block;padding:.1rem .5rem;border-radius:6px;font-size:.7rem;font-weight:700;margin-right:.4rem;vertical-align:middle}
.t-tool{background:var(--tool-bg);color:var(--tool)}
.t-machine{background:var(--mach-bg);color:var(--mach)}
.flags{display:flex;gap:.35rem;flex-wrap:wrap}
.flag{font-size:.72rem;border:1px solid var(--line);border-radius:6px;padding:.05rem .4rem;color:var(--muted)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-bottom:1.25rem}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:700px}
th{text-align:left;padding:.7rem .9rem;font-size:.8rem;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line);background:var(--bg);white-space:nowrap}
td{padding:.7rem .9rem;border-bottom:1px solid var(--line);vertical-align:top;font-size:.92rem}
tr:last-child td{border-bottom:0}
.ref{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.76rem;background:var(--bg);padding:.1rem .4rem;border-radius:6px;border:1px solid var(--line)}
.actions{display:flex;gap:.35rem;flex-wrap:wrap}
.empty{text-align:center;padding:2.5rem 1rem;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-family:"Roboto",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:1.15rem;margin-bottom:.25rem}

.sec{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;margin:1.5rem 0 .7rem}
.sec h3{font-size:1.15rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.8rem}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:1rem}
.stat .n{color:var(--blue);font-family:"Roboto",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:2rem;font-weight:700;line-height:1}
.stat .l{font-size:.82rem;color:var(--muted);margin-top:.35rem}
.stat.hot .n{color:var(--bad)}
:root[data-theme="dark"] .stat:not(.hot):not(.attn) .n{color:var(--ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .stat:not(.hot):not(.attn) .n{color:var(--ink)}}
.stat.attn .n{color:var(--warn)}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;padding:1rem;z-index:50}
.modal{background:var(--surface);border-radius:16px;padding:1.4rem;width:100%;max-width:500px;max-height:90vh;overflow:auto;border:1px solid var(--line)}
.modal.wide{max-width:860px}
.modal h3{font-size:1.3rem;margin-bottom:.5rem}
.modal .row{display:flex;gap:.6rem;justify-content:flex-end;margin-top:1rem;flex-wrap:wrap}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:0 1rem}
.kv{display:grid;grid-template-columns:140px 1fr;gap:.3rem .8rem;font-size:.92rem;margin:.6rem 0 1rem}
.kv dt{color:var(--muted)}
.timeline{list-style:none;border-left:2px solid var(--line);margin-left:.4rem}
.timeline li{padding:0 0 .8rem 1rem;position:relative;font-size:.9rem}
.timeline li::before{content:"";position:absolute;left:-6px;top:.45rem;width:10px;height:10px;border-radius:50%;background:var(--brass)}
.timeline .when{font-size:.78rem;color:var(--muted)}
.callout{background:var(--brass-soft);border-radius:10px;padding:.7rem .9rem;font-size:.88rem;margin:.6rem 0}

#toasts{position:fixed;bottom:calc(1rem + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:.5rem;z-index:60;width:min(92vw,440px)}
.toast{background:var(--navy);color:#fff;border:1px solid var(--blue);padding:.7rem 1rem;border-radius:12px;font-size:.9rem;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast.err{background:var(--bad);color:#fff}
@media (max-width:640px){.login-hero h1{font-size:1.6rem}.page-head{padding:1.4rem 0 1.25rem}.page-head h2{font-size:1.6rem}.nav-user{display:none}.kv{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script>
(() => {
'use strict';

/* ================= Storage ================= */
const mem = {}, PFX = 'ptsa5:';
const store = {
  get(k, f) { try { const v = localStorage.getItem(PFX + k); if (v !== null) return JSON.parse(v); } catch (e) {} return k in mem ? mem[k] : f; },
  set(k, v) { mem[k] = v; try { localStorage.setItem(PFX + k, JSON.stringify(v)); } catch (e) {} }
};
const get = k => store.get(k, []);
const put = (k, v) => store.set(k, v);

/* ================= Helpers ================= */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = (s, r = document) => r.querySelector(s);
const DAY = 86400000, TOOL_DAYS = 7, MAX_MACHINE_DAYS = 14;
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const nowIso = () => new Date().toISOString();
const fmtDT = d => d ? new Date(d).toLocaleString(undefined, {day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit'}) : '–';
const fmtD = d => d ? new Date(d).toLocaleDateString(undefined, {day:'numeric', month:'short', year:'numeric'}) : '–';
const toLocalInput = ms => new Date(ms - new Date(ms).getTimezoneOffset() * 60000).toISOString().slice(0, 16);
const sum = (a, f) => a.reduce((n, x) => n + (f(x) || 0), 0);
const daysLate = (due, at) => Math.max(0, Math.ceil((new Date(at).getTime() - new Date(due).getTime()) / DAY));

async function hash(pw, salt) {
  try {
    const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(salt + ':' + pw));
    return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2, '0')).join('');
  } catch (e) { return 'plain:' + pw; }
}
function toast(msg, err) {
  const t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : ''); t.textContent = msg;
  $('#toasts').appendChild(t); setTimeout(() => t.remove(), 4000);
}
function modal({title, body, confirmText = 'Confirm', cancelText = 'Cancel', danger = false, wide = false, onConfirm, onOpen}) {
  const ov = document.createElement('div'); ov.className = 'overlay';
  ov.innerHTML = `<div class="modal ${wide ? 'wide' : ''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h3>${esc(title)}</h3><div>${body}</div>
    <div class="row">${cancelText ? `<button class="btn btn-ghost" data-x>${esc(cancelText)}</button>` : ''}<button class="btn ${danger ? 'btn-danger' : 'btn-primary'}" data-ok>${esc(confirmText)}</button></div></div>`;
  document.body.appendChild(ov);
  const close = () => { ov.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = e => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', onKey);
  ov.addEventListener('click', e => { if (e.target === ov) close(); });
  const x = $('[data-x]', ov); if (x) x.onclick = close;
  $('[data-ok]', ov).onclick = () => { if (!onConfirm || onConfirm(ov) !== false) close(); };
  if (onOpen) onOpen(ov);
  const f = $('input:not([disabled]),select:not([disabled]),textarea,[data-ok]', ov); f && f.focus();
  return ov;
}
const val = (ov, id) => (ov.querySelector('#' + id)?.value ?? '').trim();
const chk = (ov, id) => !!ov.querySelector('#' + id)?.checked;
const fail = msg => { toast(msg, true); return false; };

/* ================= Constants ================= */
const SAFETY_CHECKS = [
  'I have completed the safety induction for this machine.',
  'I will wear the required protective equipment.',
  'I will only use it for my approved school project.'
];
const CONDITIONS = ['Excellent', 'Good', 'Fair', 'Poor'];
const MST = {
  available: ['Available', 'b-returned'], reserved: ['Reserved: awaiting approval', 'b-soon'], signed_out: ['Signed out', 'b-active'],
  awaiting_inspection: ['Awaiting inspection', 'b-soon'], damaged: ['Damaged', 'b-out'], under_maintenance: ['Under maintenance', 'b-soon'],
  under_repair: ['Under repair', 'b-soon'], unavailable: ['Unavailable', 'b-muted'], retired: ['Retired', 'b-muted']
};
const MST_WHY = {
  reserved: 'It is reserved and waiting for storeman approval.', signed_out: 'It is currently signed out.', awaiting_inspection: 'It was returned and is waiting for storeman inspection.',
  damaged: 'It is damaged and cannot be used.', under_maintenance: 'It is under maintenance.', under_repair: 'It is under repair.',
  unavailable: 'The storeman has marked it unavailable.', retired: 'It has been retired from service.'
};
const LST = {
  pending: ['Awaiting approval', 'b-soon'], rejected: ['Rejected', 'b-out'], cancelled: ['Cancelled', 'b-muted'], active: ['Signed out', 'b-active'],
  overdue: ['Overdue', 'b-overdue'], return_pending: ['Awaiting inspection', 'b-soon'], returned: ['Returned', 'b-returned']
};
const OUTCOMES = { ok: 'Undamaged: return to stock', needs_maintenance: 'Needs maintenance', damaged: 'Damaged: report damage', needs_repair: 'Needs repair: report damage' };
const EVL = { registered:'Registered', edited:'Details edited', requested:'Sign-out requested', approved:'Approved', rejected:'Rejected', cancelled:'Request cancelled', issued:'Signed out',
  return_requested:'Student reported return', returned:'Return confirmed', inspection:'Inspection', damage:'Damage report', maintenance:'Maintenance', repair:'Repair', status:'Availability changed', overdue:'Overdue', retired:'Retired' };

/* ================= Seed (real, empty start: the four PTSA branches only) ================= */
async function seed() {
  if (store.get('seeded', false)) return;
  put('schools', [{ id:'s1', name:'PTSA Gauteng', code:'AGP' }, { id:'s2', name:'PTSA KwaZulu-Natal', code:'KZ' }, { id:'s3', name:'PTSA Cape Town', code:'CT' }, { id:'s4', name:'PTSA Eastern Cape', code:'EC' }]);
  put('storerooms', [{ id:'r1', schoolId:'s1', name:'Main Storeroom' }, { id:'r2', schoolId:'s2', name:'Main Storeroom' }, { id:'r3', schoolId:'s3', name:'Main Storeroom' }, { id:'r4', schoolId:'s4', name:'Main Storeroom' }]);
  put('users', []); put('tools', []); put('machines', []); put('events', []);
  put('loans', []); put('damage', []); put('audit', []);
  store.set('seeded', true);
}

/* ================= State & access control ================= */
let me = null, signup = false;
const ui = { view:'', school:'all', search:'', cat:'All', room:'all', inStock:false, mAvail:false, mStatus:'all', mine:'active', mineType:'all', lType:'all', lStatus:'all', issueStu:'', lSearch:'', aSearch:'' };
const isStudent = () => me.role === 'student', isStoreman = () => me.role === 'storeman', isManager = () => me.role === 'manager', isAdmin = () => me.role === 'admin';
const staffSchools = u => u.role === 'admin' ? get('schools').map(x => x.id) : (u.schoolIds || []);
const mySchoolIds = () => isStudent() ? [me.schoolId] : staffSchools(me);
const scopeIds = () => isStudent() ? [me.schoolId] : (ui.school === 'all' ? staffSchools(me) : [ui.school]);
const inScope = sid => scopeIds().includes(sid);
const canManage = sid => isStoreman() && me.schoolIds.includes(sid);
const sName = id => get('schools').find(s => s.id === id)?.name || 'Unknown school';
const rName = id => get('storerooms').find(r => r.id === id)?.name || '–';
const vTools = () => get('tools').filter(t => inScope(t.schoolId));
const vMachines = () => get('machines').filter(m => inScope(m.schoolId));
const vLoans = () => get('loans').filter(l => inScope(l.schoolId) && (!isStudent() || l.userId === me.id));
const vDamage = () => isStudent() ? [] : get('damage').filter(d => inScope(d.schoolId));
function guard(sid, what) {
  if (canManage(sid)) return true;
  audit('access_denied', 'system', '', sid, 'Blocked: ' + what);
  toast('You do not have permission to do that for this school.', true); return false;
}
function guardStudent(sid) {
  if (me && isStudent() && me.schoolId === sid) return true;
  audit('access_denied', 'system', '', sid, 'Blocked student action');
  toast('You can only use items from your own school.', true); return false;
}

/* ================= Audit & history ================= */
function audit(action, entity, entityId, schoolId, detail, sys) {
  const a = get('audit');
  a.push({ id:uid(), at:nowIso(), userId: !sys && me ? me.id : null, actor: !sys && me ? `${me.name} (${me.email})` : 'System', role: !sys && me ? me.role : 'system', schoolId, action, entity, entityId, detail });
  if (a.length > 1500) a.splice(0, a.length - 1500);
  put('audit', a);
}
function mEvent(m, type, detail, extra = {}) {
  const ev = get('events');
  ev.push({ id:uid(), machineId:m.id, schoolId:m.schoolId, at:nowIso(), type, byId: me ? me.id : null, by: me ? me.name : 'System', detail, ...extra });
  put('events', ev);
}
function change(m, to, type, text, extra) { const from = m.status; m.status = to; mEvent(m, type, text, { from, to, ...extra }); }
function sweepOverdue() {
  const L = get('loans'), ms = get('machines'); let ch = false;
  L.forEach(l => {
    if (l.status === 'active' && !l.overdueAt && new Date(l.returnDue).getTime() < Date.now()) {
      l.overdueAt = nowIso(); ch = true;
      audit('loan_overdue', l.itemType, l.itemId, l.schoolId, `${l.itemName} (${l.ref}) passed its return time. Student: ${l.studentName}`, true);
      if (l.itemType === 'machine') { const m = ms.find(x => x.id === l.itemId); if (m) { const ev = get('events'); ev.push({ id:uid(), machineId:m.id, schoolId:m.schoolId, at:nowIso(), type:'overdue', by:'System', byId:null, detail:`Return overdue. Signed out to ${l.studentName} (${l.studentIdNo}).` }); put('events', ev); } }
    }
  });
  if (ch) put('loans', L);
}

/* ================= Status helpers ================= */
const loanStatus = l => (l.status === 'active' && new Date(l.returnDue).getTime() < Date.now()) ? 'overdue' : l.status;
function lbadge(l) {
  const s = loanStatus(l);
  const soon = s === 'active' && new Date(l.returnDue).getTime() - Date.now() < 2 * DAY;
  return `<span class="badge ${soon ? 'b-soon' : LST[s][1]}">${soon ? 'Due soon' : LST[s][0]}</span>`;
}
function dueText(l) {
  const s = loanStatus(l);
  if (s === 'overdue') { const d = daysLate(l.returnDue, Date.now()); return `${d} day${d === 1 ? '' : 's'} late`; }
  if (s === 'active') { const d = Math.ceil((new Date(l.returnDue).getTime() - Date.now()) / DAY); return d <= 1 ? 'Due within a day' : `${d} days left`; }
  if (s === 'returned' && l.returnedAt) { const d = daysLate(l.returnDue, l.returnedAt); return d ? `Returned ${d} day${d === 1 ? '' : 's'} late` : 'Returned on time'; }
  return '';
}
const mbadge = m => `<span class="badge ${MST[m.status][1]}">${MST[m.status][0]}</span>`;

function setSignup(on) {

}
const loginError = m => { const e = $('#loginError'); e.textContent = m; e.classList.remove('hidden'); };
async function authenticate(email, pw) {
  email = email.trim().toLowerCase();
  const us = get('users');
  if (signup) {
    const name = $('#suName').value.trim(), sid = $('#suId').value.trim(), school = $('#suSchool').value;
    if (!name || !sid || !school) return loginError('Enter your name, student ID and school.');
    if (pw.length < 6) return loginError('Password must be at least 6 characters.');
    if (us.some(u => u.email.toLowerCase() === email)) return loginError('An account with that email already exists. Sign in instead.');
    if (us.some(u => u.role === 'student' && u.schoolId === school && (u.studentId || '').toLowerCase() === sid.toLowerCase())) return loginError('That student ID is already registered at this school.');
    const salt = uid();
    const u = { id: uid(), email, name, role:'student', studentId:sid, schoolId:school, salt, passHash: await hash(pw, salt) };
    us.push(u); put('users', us); me = u; audit('account_created', 'user', u.id, school, `Student account created for ${name} (${sid})`);
    return enter(u);
  }
  const u = us.find(x => x.email.toLowerCase() === email);
  if (!u || (await hash(pw, u.salt)) !== u.passHash) return loginError('Wrong email or password. Check both and try again.');
  me = u; audit('login', 'user', u.id, u.schoolId || u.schoolIds[0], 'Signed in');
  enter(u);
}

function addTool() {

function editTool(id) {
  const t = get('tools').find(x => x.id === id); if (!t || !guard(t.schoolId, 'edit tool')) return;
  const held = t.quantityTotal - t.quantityAvailable;
  modal({ title: `Edit ${t.name}`, body: toolForm(t) + (held ? `<div class="hint">${held} on loan or damaged, so the total can't go below ${held}.</div>` : ''), confirmText: 'Save changes', onConfirm: ov => {

    x.name = name; x.category = cat; x.description = val(ov, 'fDesc'); x.storeroomId = val(ov, 'fRoom'); x.quantityAvailable = qty - held; x.quantityTotal = qty;

}
function deleteTool(id) {
  const t = get('tools').find(x => x.id === id); if (!t || !guard(t.schoolId, 'delete tool')) return;
  if (get('loans').some(l => l.itemId === id && ['active', 'pending'].includes(l.status))) return toast(`${t.name} still has tools on loan or requested. Confirm those returns first.`, true);
  modal({ title: `Delete ${t.name}?`, danger: true, confirmText: 'Delete tool', body: '<p>This removes the tool from the list. Past transactions stay in the history.</p>', onConfirm: () => {
    put('tools', get('tools').filter(x => x.id !== id)); audit('tool_deleted', 'tool', id, t.schoolId, `Deleted ${t.name}`); toast('Tool deleted'); render();
  } });
}
function toolReturn(id) {
  const l = get('loans').find(x => x.id === id); if (!l || !guard(l.schoolId, 'confirm tool return')) return;
  const prior = get('damage').find(d => d.loanId === id && d.status === 'open');
  modal({ title: `Confirm return: ${l.itemName}`, confirmText: 'Confirm return', body: `<p>${esc(l.studentName)} (${esc(l.studentIdNo)}) · ref <span class="ref">${esc(l.ref)}</span>${loanStatus(l) === 'overdue' ? '<br><strong>This return is overdue.</strong>' : ''}</p>
    ${prior ? `<div class="callout">The student reported damage: ${esc(prior.description)}</div>` : ''}
    <div class="field"><label for="tCond">Condition on return</label><select class="select" id="tCond"><option value="good">Good: return to stock</option><option value="damaged" ${prior ? 'selected' : ''}>Damaged: report damage</option></select></div>
    <div class="field"><label for="tNote">Damage details <span class="hint">(required if damaged)</span></label><textarea class="input" id="tNote" rows="2">${esc(prior ? prior.description : '')}</textarea></div>`,
    onConfirm: ov => {
      const damaged = val(ov, 'tCond') === 'damaged', note = val(ov, 'tNote');
      if (damaged && !note) return fail('Describe the damage so it can be reported.');
      const L = get('loans'), x = L.find(y => y.id === id), ts = get('tools'), t = ts.find(y => y.id === x.itemId);
      if (x.status !== 'active') return fail('This checkout was already handled.');
      x.status = 'returned'; x.returnedAt = nowIso(); x.confirmedBy = me.name; x.confirmedById = me.id; x.condition = damaged ? 'damaged' : 'good';
      if (t) { if (damaged) t.quantityDamaged++; else t.quantityAvailable++; }
      if (damaged) {
        const D = get('damage'), p = D.find(d => d.loanId === id && d.status === 'open');
        if (p) { p.stockApplied = true; p.description = note; put('damage', D); x.damageReportId = p.id; audit('damage_confirmed', 'tool', x.itemId, x.schoolId, `Student damage report for ${x.itemName} (${x.ref}) confirmed on return: ${note}`); }
        else x.damageReportId = createDamage({ itemType:'tool', itemId:x.itemId, name:x.itemName, ref:x.ref, schoolId:x.schoolId, storeroomId:x.storeroomId, loanId:x.id, studentName:x.studentName, description:note, severity:'minor', source:'storeman', stockApplied:true });
      }
      put('loans', L); put('tools', ts);
      audit('tool_returned', 'tool', x.itemId, x.schoolId, `${x.itemName} (${x.ref}) return confirmed from ${x.studentName}. Condition: ${x.condition}.${daysLate(x.returnDue, x.returnedAt) ? ' Returned late.' : ''}`);
      toast(damaged ? 'Return confirmed and damage recorded' : 'Return confirmed'); render();
    } });
}

function createDamage(d) {

  D.push(r); put('damage', D);

function pgDamage() {

    ${rows.map(d => `<tr><td>${fmtDT(d.at)}</td><td>${typeTag(d.itemType)}<strong>${esc(d.name)}</strong><div class="card-sub"><span class="ref">${esc(d.ref)}</span></div></td>${multi ? `<td>${esc(sName(d.schoolId))}</td>` : ''}
    <td>${esc(d.description)}${d.severity ? `<div class="card-sub">Severity: ${esc(d.severity)}</div>` : ''}</td><td>${d.loanId ? `${esc(d.studentName || '')}<div class="card-sub">#${esc(d.loanId.slice(-5))}</div>` : '–'}</td><td>${esc(d.reportedBy)}${d.source === 'student' ? '<div class="card-sub">Student report</div>' : ''}</td>
    <td><span class="badge ${d.status === 'open' ? 'b-out' : 'b-returned'}">${d.status === 'open' ? 'Open' : 'Resolved'}</span>${d.resolution ? `<div class="card-sub">${esc(d.resolution)}</div>` : ''}</td>
    <td>${d.status === 'open' && canManage(d.schoolId) ? `<div class="actions">${d.stockApplied === false && !d.loanId ? `<button class="btn btn-ghost btn-sm" data-a="takeout" data-id="${esc(d.id)}">Take out of service</button>` : ''}<button class="btn btn-ghost btn-sm" data-a="resolve" data-id="${esc(d.id)}">Resolve</button></div>` : ''}</td></tr>`).join('')}</tbody></table></div>` : '<div class="empty"><strong>No damage reports</strong>Reports created during returns and inspections appear here.</div>'}</div>`;
}
function resolveDamage(id) {
  const d = get('damage').find(x => x.id === id); if (!d || !guard(d.schoolId, 'resolve damage')) return;
  const applied = d.stockApplied !== false;
  const extra = d.itemType === 'tool' ? (applied ? `<div class="field"><label for="rOut">Outcome</label><select class="select" id="rOut"><option value="repaired">Repaired: return to stock</option><option value="writeoff">Written off: remove from stock</option></select></div>` : '') : '<p class="hint">Use Service on the Machines page to record repairs and return the machine to use.</p>';
  modal({ title: `Resolve damage: ${d.name}`, confirmText: 'Resolve report', body: `${extra}<div class="field"><label for="rNote">Resolution note</label><textarea class="input" id="rNote" rows="2"></textarea></div>`, onConfirm: ov => {
    const note = val(ov, 'rNote'); if (!note) return fail('Add a short resolution note.');
    const D = get('damage'), x = D.find(y => y.id === id); if (x.status !== 'open') return fail('Already resolved.');
    let text = note;
    if (x.itemType === 'tool' && x.stockApplied !== false) {
      const out = val(ov, 'rOut'), ts = get('tools'), t = ts.find(y => y.id === x.itemId);
      if (t && t.quantityDamaged > 0) { t.quantityDamaged--; if (out === 'repaired') t.quantityAvailable++; else t.quantityTotal--; put('tools', ts); }
      text = (out === 'repaired' ? 'Repaired. ' : 'Written off. ') + note;
    }
    x.status = 'resolved'; x.resolvedAt = nowIso(); x.resolvedBy = me.name; x.resolution = text; put('damage', D);
    const m = get('machines').find(y => y.id === x.itemId); if (m && x.itemType === 'machine') mEvent(m, 'damage', `Damage report resolved: ${text}`);
    audit('damage_resolved', x.itemType, x.itemId, x.schoolId, `Damage report for ${x.name} resolved: ${text}`); toast('Report resolved'); render();
  } });
}

      <td><span class="badge ${d.status === 'open' ? 'b-soon' : 'b-returned'}">${d.status === 'open' ? 'With the storeman' : 'Resolved'}</span>${d.resolution ? `<div class="card-sub">${esc(d.resolution)}</div>` : ''}</td></tr>`).join('')}</tbody></table></div>` : '<div class="empty"><strong>No reports yet</strong>Reports you submit will show up here.</div>'}</div>`;
  fillReportItems();
}
function applyStock(rid) {
  const D = get('damage'), d = D.find(x => x.id === rid); if (!d || d.stockApplied !== false) return false;
  let ok = false;
  if (d.itemType === 'tool') { const ts = get('tools'), t = ts.find(x => x.id === d.itemId); if (t && t.quantityAvailable >= 1) { t.quantityAvailable--; t.quantityDamaged++; put('tools', ts); ok = true; } }
  else { const ms = get('machines'), m = ms.find(x => x.id === d.itemId); if (m && ['available', 'unavailable', 'damaged'].includes(m.status)) { if (m.status !== 'damaged') change(m, 'damaged', 'damage', `Taken out of service after a damage report: ${d.description}`, { reportId:d.id }); put('machines', ms); ok = true; } }
  if (ok) { d.stockApplied = true; put('damage', D); audit('damage_applied', d.itemType, d.itemId, d.schoolId, `${d.name} taken out of service after a damage report`); }
  return ok;
}
function takeOut(id) {
  const d = get('damage').find(x => x.id === id); if (!d || !guard(d.schoolId, 'take item out of service')) return;
  const ok = applyStock(id);
  toast(ok ? 'Taken out of service' : 'Could not take it out of service because none are in stock or it is in use. It updates when returned.', !ok); render();
}
function submitReport() {
  const type = $('#rType').value, itemId = $('#rItem').value, desc = $('#rDesc').value.trim(), sev = $('#rSev').value;
  if (!itemId) return toast('Choose the item that is damaged.', true);
  if (!desc) return toast('Describe the damage.', true);
  const item = (type === 'tool' ? get('tools') : get('machines')).find(x => x.id === itemId); if (!item) return toast('That item no longer exists.', true);
  if (isStudent() ? !guardStudent(item.schoolId) : !guard(item.schoolId, 'report damage')) return;
  const loan = isStudent() ? get('loans').find(l => l.itemId === itemId && l.userId === me.id && ['active', 'return_pending'].includes(l.status)) : null;
  const rid = createDamage({ itemType:type, itemId, name:item.name, ref:type === 'machine' ? item.refNo : (loan ? loan.ref : '–'), schoolId:item.schoolId, storeroomId:item.storeroomId, loanId:loan ? loan.id : null, studentName:loan ? loan.studentName : null, description:desc, severity:sev, source:isStudent() ? 'student' : 'storeman', stockApplied:false });
  if (type === 'machine') { const ms = get('machines'), m = ms.find(x => x.id === itemId); mEvent(m, 'damage', `Damage reported by ${me.name}: ${desc}`, { reportId:rid }); }
  let msg = 'Report sent to the storeman.';
  if (isStoreman()) msg = applyStock(rid) ? 'Damage recorded and the item is out of service.' : 'Damage recorded. It will be applied when the item comes back.';
  toast(msg); pgReport();
}

      const label = esc(x.name) + (type === 'machine' ? ` (${esc(x.refNo)})` : '') + ` · ${esc(rName(x.storeroomId))}` + (type === 'tool' ? ` · ${x.quantityAvailable} in stock` : ` · ${esc(MST[x.status][0])}`) + (held ? ' · student has this' : '');
      return `<option value="${esc(x.id)}" ${!avail || held ? 'disabled' : ''}>${label}</option>`;
    }).join('');
    if (src === 'iType' || !$('#iDue').value) $('#iDue').value = toLocalInput(Date.now() + (type === 'tool' ? TOOL_DAYS : 1) * DAY);
  }
  const m = type === 'machine' ? get('machines').find(x => x.id === $('#iItem').value) : null;
  $('#iExtra').innerHTML = m ? `${m.requiresAuth ? '<div class="callout">This machine needs approval. Signing it out counts as your approval.</div>' : ''}${m.requiresSafetyCheck ? `<div class="field"><label>Safety check: confirm the student has agreed to each point</label>${SAFETY_CHECKS.map((t, i) => `<label class="check"><input type="checkbox" data-isafe="${i}"> ${esc(t)}</label>`).join('')}</div>` : ''}` : '';
}
function submitIssue() {
  const stu = get('users').find(u => u.id === $('#iStu').value), type = $('#iType').value, itemId = $('#iItem').value;
  if (!stu) return toast('Choose the student first.', true);
  if (!itemId) return toast('Choose the item to sign out.', true);
  if (!guard(stu.schoolId, 'sign out to student')) return;
  const dueMs = new Date($('#iDue').value).getTime();
  if (!dueMs || dueMs < Date.now() + 1800000) return toast('Choose a return time at least 30 minutes from now.', true);
  if (dueMs > Date.now() + MAX_MACHINE_DAYS * DAY + 60000) return toast(`The return time can be at most ${MAX_MACHINE_DAYS} days from now.`, true);
  const L = get('loans');
  if (L.some(l => l.userId === stu.id && loanStatus(l) === 'overdue')) return toast(`${stu.name} has overdue items and can't borrow until they are returned.`, true);
  if (L.some(l => l.userId === stu.id && l.itemId === itemId && OPEN_LOAN.includes(l.status))) return toast(`${stu.name} already has this item.`, true);
  const t = nowIso(), due = new Date(dueMs).toISOString();
  const base = { id:uid(), userId:stu.id, studentName:stu.name, studentIdNo:stu.studentId, requestedAt:t, signedOutAt:t, returnDue:due, status:'active', issuedBy:me.name, issuedById:me.id };
  if (type === 'tool') {
    const ts = get('tools'), tool = ts.find(x => x.id === itemId);
    if (!tool || tool.schoolId !== stu.schoolId) return toast('That tool belongs to a different school.', true);
    if (tool.quantityAvailable < 1) return toast('That tool is out of stock.', true);
    tool.quantityAvailable--; put('tools', ts);
    const ref = `TL-${tool.id.slice(-3).toUpperCase()}-${Math.random().toString(36).slice(2, 6).toUpperCase()}`;
    L.push({ ...base, itemType:'tool', itemId, itemName:tool.name, ref, schoolId:tool.schoolId, storeroomId:tool.storeroomId }); put('loans', L);
    audit('tool_signed_out', 'tool', itemId, tool.schoolId, `${tool.name} signed out to ${stu.name} (${stu.studentId}) by ${me.name}. Ref ${ref}. Due ${fmtDT(due)}.`);
    toast(`${tool.name} signed out to ${stu.name}. Reference ${ref}`);
  } else {
    const ms = get('machines'), m = ms.find(x => x.id === itemId);
    if (!m || m.schoolId !== stu.schoolId) return toast('That machine belongs to a different school.', true);
    if (m.status !== 'available') return toast(`That machine is ${MST[m.status][0].toLowerCase()}.`, true);
    let items = [];
    if (m.requiresSafetyCheck) { if (![...document.querySelectorAll('[data-isafe]')].every(b => b.checked)) return toast('Tick every safety confirmation to continue.', true); items = SAFETY_CHECKS.slice(); }
    const loan = { ...base, itemType:'machine', itemId, itemName:m.name, ref:m.refNo, schoolId:m.schoolId, storeroomId:m.storeroomId, authRequired:m.requiresAuth, authStatus:m.requiresAuth ? 'approved' : 'not_required',
      approvedBy:m.requiresAuth ? me.name : undefined, approvedById:m.requiresAuth ? me.id : undefined, approvedAt:m.requiresAuth ? t : undefined, safety:{ required:m.requiresSafetyCheck, confirmedAt:items.length ? t : null, items, recordedBy:me.name } };
    L.push(loan); put('loans', L); m.currentLoanId = loan.id;
    change(m, 'signed_out', 'issued', `Signed out to ${stu.name} (${stu.studentId}) by ${me.name}. Due ${fmtDT(due)}.${m.requiresAuth ? ' Approved by the storeman.' : ''}`); put('machines', ms);
    audit('machine_signed_out', 'machine', itemId, m.schoolId, `${m.name} (${m.refNo}) signed out to ${stu.name} (${stu.studentId}) by ${me.name}. Due ${fmtDT(due)}.${items.length ? ' Safety check confirmed.' : ''}`);
    toast(`${m.name} signed out to ${stu.name}.`);
  }
  $('#iDue').value = ''; pgIssue();
}

function approve(id) {

  const isTool = l.itemType === 'tool';
  modal({ title: `Approve ${l.itemName}`, confirmText: isTool ? 'Approve and sign out' : 'Approve and issue', body: `<p>${esc(l.studentName)} (${esc(l.studentIdNo)}) · <span class="ref">${esc(l.ref)}</span><br>${isTool ? '' : (l.safety?.confirmedAt ? 'Safety check confirmed by the student.' : 'No safety check required.')}</p>

    <div class="field"><label for="aNote">Conditions or supervision notes</label><textarea class="input" id="aNote" rows="2" placeholder="Optional"></textarea></div>`, onConfirm: ov => {
    const due = new Date(ov.querySelector('#aDue').value).getTime(); if (!due || due < Date.now()) return fail('Choose a return time in the future.');

/* ================= Dashboard ================= */
function calcStats(sids) {
  const T = get('tools').filter(t => sids.includes(t.schoolId)), M = get('machines').filter(m => sids.includes(m.schoolId)), L = get('loans').filter(l => sids.includes(l.schoolId));
  const tl = L.filter(l => l.itemType === 'tool'), ml = L.filter(l => l.itemType === 'machine'), mc = s => M.filter(m => m.status === s).length;
  return { tAvail: sum(T, t => t.quantityAvailable), tOut: tl.filter(l => l.status === 'active').length, tOver: tl.filter(l => loanStatus(l) === 'overdue').length, tDmg: sum(T, t => t.quantityDamaged),
    mAvail: mc('available'), mOut: mc('signed_out'), mOver: ml.filter(l => loanStatus(l) === 'overdue').length, mDmg: mc('damaged'), mInsp: mc('awaiting_inspection'), mMaint: mc('under_maintenance'), mRepair: mc('under_repair'), mPend: L.filter(l => l.status === 'pending').length, dOpen: get('damage').filter(d => sids.includes(d.schoolId) && d.status === 'open').length, mTotal: M.length };
}
const stat = (n, l, cls = '') => `<div class="stat ${n && cls ? cls : ''}"><div class="n">${n}</div><div class="l">${l}</div></div>`;
function pgDash() {
  const sids = scopeIds(), s = calcStats(sids), L = vLoans();
  const out = L.filter(l => ['active', 'return_pending'].includes(l.status)).sort((a, b) => (loanStatus(b) === 'overdue') - (loanStatus(a) === 'overdue') || (a.itemType === 'machine' ? -1 : 1) - (b.itemType === 'machine' ? -1 : 1) || a.returnDue.localeCompare(b.returnDue)).slice(0, 12);
  const usage = vMachines().map(m => { const ml = L.filter(l => l.itemType === 'machine' && l.itemId === m.id && l.signedOutAt); return { m, all: ml.length, d30: ml.filter(l => Date.now() - new Date(l.signedOutAt).getTime() < 30 * DAY).length, late: ml.filter(l => l.overdueAt || (l.returnedAt && daysLate(l.returnDue, l.returnedAt))).length }; }).sort((a, b) => b.all - a.all).slice(0, 10);
  $('#main').innerHTML = `<div class="page-head"><div><h2>Dashboard</h2><p>${sids.length > 1 ? 'All assigned schools' : esc(sName(sids[0]))}</p></div></div>${banner()}
    <div class="sec" style="margin-top:0"><h3>Tools</h3></div><div class="stats">${stat(s.tAvail, 'Available tools')}${stat(s.tOut, 'Signed-out tools')}${stat(s.tOver, 'Overdue tool returns', 'hot')}${stat(s.tDmg, 'Damaged tools', 'hot')}</div>
    <div class="sec"><h3>Machines</h3></div><div class="stats">${stat(s.mAvail, 'Available machines')}${stat(s.mOut, 'Signed-out machines')}${stat(s.mOver, 'Overdue machine returns', 'hot')}${stat(s.mDmg, 'Damaged machines', 'hot')}</div>
    <div class="sec"><h3>Needs attention</h3></div><div class="stats">${stat(s.mPend, 'Awaiting approval', 'attn')}${stat(s.mInsp, 'Awaiting inspection', 'attn')}${stat(s.mMaint, 'In maintenance', 'attn')}${stat(s.mRepair, 'Under repair', 'attn')}${stat(s.dOpen, 'Open damage reports', 'attn')}</div>
    ${sids.length > 1 ? `<div class="sec"><h3>By school</h3></div><div class="panel"><div class="table-wrap"><table><thead><tr><th>School</th><th>Tools avail.</th><th>Machines avail.</th><th>Tools out</th><th>Machines out</th><th>Tools overdue</th><th>Machines overdue</th><th>Tools damaged</th><th>Machines damaged</th><th>Awaiting insp.</th><th>Maint. / repair</th></tr></thead><tbody>
    ${sids.map(id => { const x = calcStats([id]); return `<tr><td><strong>${esc(sName(id))}</strong></td><td>${x.tAvail}</td><td>${x.mAvail}</td><td>${x.tOut}</td><td>${x.mOut}</td><td>${x.tOver}</td><td>${x.mOver}</td><td>${x.tDmg}</td><td>${x.mDmg}</td><td>${x.mInsp}</td><td>${x.mMaint + x.mRepair}</td></tr>`; }).join('')}</tbody></table></div></div>` : ''}
    <div class="sec"><h3>Outstanding returns</h3></div><div class="panel">${loanTable(out, { empty: 'Nothing outstanding', emptyHint: 'Everything borrowed has been returned.' })}</div>
    <div class="sec"><h3>Machine usage</h3></div><div class="panel">${usage.length ? `<div class="table-wrap"><table><thead><tr><th>Machine</th><th>School</th><th>Status</th><th>Sign-outs (all time)</th><th>Last 30 days</th><th>Late returns</th></tr></thead><tbody>
    ${usage.map(u => `<tr><td><strong>${esc(u.m.name)}</strong><div class="card-sub"><span class="ref">${esc(u.m.refNo)}</span></div></td><td>${esc(sName(u.m.schoolId))}</td><td>${mbadge(u.m)}</td><td>${u.all}</td><td>${u.d30}</td><td>${u.late}</td></tr>`).join('')}</tbody></table></div>` : '<div class="empty"><strong>No machines yet</strong></div>'}</div>`;
}

/* ================= Audit ================= */
function pgAudit() {
  $('#main').innerHTML = `<div class="page-head"><div><h2>Audit log</h2><p>Every sign-out, return, approval, inspection and change, with who did it and when.</p></div></div>${banner()}
    <div class="toolbar"><input class="input" data-search="aSearch" type="search" placeholder="Search by person, action or item" aria-label="Search audit log" value="${esc(ui.aSearch)}"></div><div class="panel" id="list"></div>`;
  drawAudit();
}
function drawAudit() {
  const q = ui.aSearch.toLowerCase(), A = get('audit').filter(a => !a.schoolId || inScope(a.schoolId)).filter(a => !q || (a.actor + a.action + a.detail + a.entity).toLowerCase().includes(q)).sort((a, b) => b.at.localeCompare(a.at)).slice(0, 300);
  $('#list').innerHTML = A.length ? `<div class="table-wrap"><table><thead><tr><th>When</th><th>Who</th><th>School</th><th>Action</th><th>Details</th></tr></thead><tbody>${A.map(a => `<tr><td>${fmtDT(a.at)}</td><td>${esc(a.actor)}<div class="card-sub">${esc(a.role)}</div></td><td>${a.schoolId ? esc(sName(a.schoolId)) : '–'}</td><td><span class="ref">${esc(a.action)}</span></td><td>${esc(a.detail)}</td></tr>`).join('')}</tbody></table></div>` : '<div class="empty"><strong>No entries</strong></div>';
}

/* ================= Events ================= */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
    const a = el.dataset.a, id = el.dataset.id;
  const H = { go: () => go(id), logout, cat: () => { ui.cat = id; render(); }, submitissue: submitIssue, addschool: addSchool, editcode: () => editSchoolCode(id), delschool: () => deleteSchool(id), addroom: () => addStoreroom(id), addstoreman: () => addStoreman(id), rmuser: () => removeUser(id), pwreset: () => resetPassword(id), addmgr: addManager, editmgr: () => editManager(id), mview: () => machineModal(id), mine: () => { ui.mine = id; pgMine(); }, minetype: () => { ui.mineType = id; pgMine(); },
    cancel: () => cancelRequest(id), reqtool: () => requestTool(id), reqmach: () => requestMachine(id), approve: () => approve(id), reject: () => reject(id), inspret: () => inspectReturn(id), toolret: () => toolReturn(id),
    addtool: addTool, edittool: () => editTool(id), deltool: () => deleteTool(id), addmach: addMachine, editmach: () => editMachine(id), inspmach: () => inspectMachine(id), service: () => serviceMachine(id), history: () => historyModal(id),
    mstatus: () => { ui.mStatus = id; pgMachinesStaff(); }, ltype: () => { ui.lType = id; pgLoans(); }, lstatus: () => { ui.lStatus = id; pgLoans(); }, resolve: () => resolveDamage(id), csv: exportCsv, submitreport: submitReport, takeout: () => takeOut(id) };
  H[a] && H[a]();
});
document.addEventListener('input', e => { const k = e.target.dataset.search; if (k) { ui[k] = e.target.value; redraw(); } else if (e.target.id === 'iFind') fillIssueStudents(); });
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'scopeSel') { ui.school = t.value; go(ui.view); }
  else if (t.id === 'rType') fillReportItems();
  else if (['iStu', 'iType', 'iItem'].includes(t.id)) refreshIssue(t.id);
  else if (t.dataset.k) { ui[t.dataset.k] = t.type === 'checkbox' ? t.checked : t.value; redraw(); }
});
$('#loginForm').addEventListener('submit', e => { e.preventDefault(); authenticate($('#loginEmail').value, $('#loginPassword').value); });
$('#switchBtn').addEventListener('click', () => setSignup(!signup));
